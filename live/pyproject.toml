[project]
name = "live"
version = "1.0.0"
description = "The live cascade: updating the warehouse and simulation in real time."
requires-python = ">=3.12"
dependencies = [
    "warehouse",
    "epa",
    "pridge",
    "sim",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live"]
