[project]
name = "live"
version = "1.0.0"
description = "The live cascade: updating the warehouse and simulation in real time."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "warehouse",
    "epa",
    "pridge",
    "sim",
    "numpy>=2.1",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.scripts]
live = "live.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live"]
