[project]
name = "sim"
version = "1.0.0"
description = "FTC event and season simulation."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "warehouse",
    "numpy>=2.1",
    "scipy>=1.18",
    "typer>=0.15",
]

[project.scripts]
sim = "sim.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim"]
